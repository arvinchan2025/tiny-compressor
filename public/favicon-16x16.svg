<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主渐变 - 使用Tailwind primary色彩系统 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:0.9" />
    </linearGradient>
    
    <!-- 箭头渐变 - 更亮的蓝色调 -->
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    
    <!-- 背景光晕效果 -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0" />
    </radialGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.8" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景光晕 -->
  <circle cx="8" cy="8" r="7.2" fill="url(#glowGradient)"/>
  
  <!-- 主文档图标 - 与logo完全一致的比例设计 (16x16版本) -->
  <path d="M2.4 3.2C2.4 2.53728 2.93728 2 3.6 2H12.4C13.0627 2 13.6 2.53728 13.6 3.2V12.8C13.6 13.4627 13.0627 14 12.4 14H3.6C2.93728 14 2.4 13.4627 2.4 12.8V3.2Z" 
        fill="url(#mainGradient)" 
        stroke="url(#mainGradient)" 
        stroke-width="0.32"
        rx="1.2"
        ry="1.2"
        filter="url(#shadow)"/>
  
  <!-- 折叠角 - 与logo完全一致 -->
  <path d="M11.6 2L13.6 4V3.2C13.6 2.53728 13.0627 2 12.4 2H11.6Z" 
        fill="url(#mainGradient)" 
        fill-opacity="0.8"/>
  
  <!-- 压缩箭头 - 与logo完全一致的比例和位置 -->
  <path d="M6 8L10 8M8 6L10 8L8 10" 
        stroke="url(#arrowGradient)" 
        stroke-width="1.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)"/>
  
  <!-- 数据流粒子 - 与logo完全一致的位置和大小比例 -->
  <circle cx="4.8" cy="6.4" r="0.8" fill="url(#mainGradient)" opacity="0.9"/>
  <circle cx="3.6" cy="8" r="0.64" fill="url(#mainGradient)" opacity="0.7"/>
  <circle cx="5.2" cy="10.4" r="0.48" fill="url(#mainGradient)" opacity="0.5"/>
  
  <circle cx="11.2" cy="6.4" r="0.8" fill="url(#mainGradient)" opacity="0.9"/>
  <circle cx="12.4" cy="8" r="0.64" fill="url(#mainGradient)" opacity="0.7"/>
  <circle cx="10.8" cy="10.4" r="0.48" fill="url(#mainGradient)" opacity="0.5"/>
  
  <!-- 额外的装饰粒子 - 与logo完全一致 -->
  <circle cx="8" cy="4.8" r="0.48" fill="url(#arrowGradient)" opacity="0.6"/>
  <circle cx="8" cy="11.2" r="0.4" fill="url(#arrowGradient)" opacity="0.4"/>
</svg>
